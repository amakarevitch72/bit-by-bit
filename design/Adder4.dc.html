<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench: 4-bit adder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 16px 12px 4px; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Back to journey" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #C5CCD6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA4B2">LEVEL 8 · WORKBENCH</span>
      <span style="font-size: 16px; font-weight: 600">Build a 4-bit adder</span>
    </div>
    <button aria-label="Hint" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2A3140; background: #171B22; color: #F5B544; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"></path></svg>
    </button>
  </header>

  <main style="flex: 1; padding: 2px 16px 0; display: flex; flex-direction: column; gap: 10px">

    <!-- Numbers readout -->
    <div role="status" style="padding: 10px 14px; border-radius: 14px; background: #171B22; border: 1px solid #2A3140; display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; align-items: end">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">{{aDec}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA4B2">{{aBin}}</span>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; color: #9AA4B2; padding-bottom: 20px">+</span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">{{bDec}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA4B2">{{bBin}}</span>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; color: #9AA4B2; padding-bottom: 20px">=</span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="{{sumStyle}}">{{sumDec}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA4B2">{{sumBin}}</span>
      </div>
    </div>

    <!-- Board -->
    <div style="position: relative; height: 300px; border-radius: 18px; background-color: #12161C; border: 1px solid #232A36; background-image: radial-gradient(#232A36 1px, transparent 1px); background-size: 16px 16px; overflow: hidden">
      <span style="position: absolute; left: 14px; top: 40px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">A</span>
      <span style="position: absolute; left: 14px; top: 92px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">B</span>

      <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
        <span style="{{c.headStyle}}">×{{c.weight}}</span>
        <button onClick="{{c.toggleA}}" aria-pressed="{{c.aOn}}" aria-label="{{c.aLabel}}" style="{{c.aStyle}}">{{c.aVal}}</button>
        <button onClick="{{c.toggleB}}" aria-pressed="{{c.bOn}}" aria-label="{{c.bLabel}}" style="{{c.bStyle}}">{{c.bVal}}</button>
        <button onClick="{{c.place}}" aria-label="{{c.sockLabel}}" style="{{c.sockStyle}}">{{c.sym}}</button>
        <div style="{{c.downWire}}"></div>
        <div style="{{c.ledStyle}}"></div>
        <span style="{{c.ledLabel}}">S{{c.bit}}</span>
      </sc-for>

      <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
        <div style="{{l.wireStyle}}"></div>
        <button onClick="{{l.toggle}}" aria-pressed="{{l.on}}" aria-label="{{l.label}}" style="{{l.btnStyle}}">
          <svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 7H3M7 2L2 7l5 5"></path></svg>
        </button>
      </sc-for>

      <!-- Cout -->
      <div style="{{coutWire}}"></div>
      <div style="{{coutLed}}"></div>
      <span style="position: absolute; left: 4px; top: 196px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #C5CCD6">Cout</span>
      <span style="position: absolute; left: 6px; top: 212px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA4B2">×16</span>    </div>

    <!-- Chip tray -->
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #9AA4B2">{{trayHint}}</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tray}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.pick}}" aria-pressed="{{t.selected}}" style="{{t.style}}">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">{{t.sym}}</span>
            <span style="font-size: 11px; color: #9AA4B2">{{t.name}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <!-- Test suite -->
    <div style="padding: 10px 12px; border-radius: 14px; background: #171B22; border: 1px solid #2A3140; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 13px; font-weight: 600">{{testTitle}}</span>
        <span style="{{testDetailStyle}}">{{testDetail}}</span>
      </div>
      <button onClick="{{runAll}}" disabled="{{cantRun}}" style="{{runStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>
        Test all 256
      </button>
    </div>
  </main>

  <footer style="padding: 10px 16px 22px">
    <sc-if value="{{allPass}}" hint-placeholder-val="{{ false }}">
      <a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: #4ADE80; color: #0B2414; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        Unlock the 4-bit ADD chip
      </a>
    </sc-if>
    <sc-if value="{{notPass}}" hint-placeholder-val="{{ true }}">
      <button disabled style="{{waitStyle}}">{{waitText}}</button>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 5, b: 3, socks: ['FA', 'FA', null, null], links: [true, false, false], sel: null, test: null };
  }
  sim(st, a, b) {
    var carry = false, sum = 0, prevCo = false;
    for (var i = 0; i < 4; i++) {
      var g = st.socks[i];
      if (!g) return null;
      var ai = !!(a & (1 << i)), bi = !!(b & (1 << i));
      var cin = i === 0 ? false : (st.links[i - 1] ? prevCo : false);
      var s, co;
      if (g === 'FA') { s = (ai !== bi) !== cin; co = (ai && bi) || (cin && (ai !== bi)); }
      else if (g === 'HA') { s = ai !== bi; co = ai && bi; }
      else { s = ai || bi; co = false; }
      if (s) sum |= (1 << i);
      prevCo = co;
    }
    if (prevCo) sum |= 16;
    return sum;
  }
  carries(st, a, b) {
    var out = [], prevCo = false;
    for (var i = 0; i < 4; i++) {
      var g = st.socks[i];
      var ai = !!(a & (1 << i)), bi = !!(b & (1 << i));
      var cin = i === 0 ? false : (st.links[i - 1] ? prevCo : false);
      var co = null, s = null;
      if (g === 'FA') { s = (ai !== bi) !== cin; co = (ai && bi) || (cin && (ai !== bi)); }
      else if (g === 'HA') { s = ai !== bi; co = ai && bi; }
      else if (g === 'OR') { s = ai || bi; co = false; }
      out.push({ s: s, co: co });
      prevCo = !!co;
    }
    return out;
  }
  ready(st) { return st.socks.every(function (x) { return !!x; }); }
  place(i) {
    var socks = this.state.socks.slice();
    if (this.state.sel) { socks[i] = this.state.sel; this.setState({ socks: socks, sel: null, test: null }); }
    else if (socks[i]) { socks[i] = null; this.setState({ socks: socks, test: null }); }
  }
  toggleLink(i) {
    var links = this.state.links.slice();
    links[i] = !links[i];
    this.setState({ links: links, test: null });
  }
  runAll() {
    var st = this.state;
    if (!this.ready(st)) return;
    var pass = 0, fail = null;
    for (var a = 0; a < 16; a++) {
      for (var b = 0; b < 16; b++) {
        var got = this.sim(st, a, b);
        if (got === a + b) pass++;
        else if (!fail) fail = { a: a, b: b, got: got };
      }
    }
    this.setState({ test: { pass: pass, fail: fail } });
  }
  renderVals() {
    var self = this, st = this.state;
    var HIGH = '#4ADE80', LOW = '#3A4352';
    var SYM = { FA: 'FA', HA: 'HA', OR: '≥1' };
    var a = st.a, b = st.b;
    var ready = this.ready(st);
    var sum = ready ? this.sim(st, a, b) : null;
    var per = this.carries(st, a, b);
    function bin(n, w) { var s = n.toString(2); while (s.length < w) s = '0' + s; return s; }
    function X(k) { return 44 + (3 - k) * 80; }
    var bitBtn = 'position: absolute; width: 66px; height: 44px; box-sizing: border-box; border-radius: 10px; font-family: JetBrains Mono, monospace; font-size: 18px; font-weight: 700; cursor: pointer; color: #E8ECF2; ';
    function onOff(on) { return on ? 'background: #12301F; border: 2px solid #4ADE80;' : 'background: #171B22; border: 2px solid #2A3140;'; }

    var cols = [3, 2, 1, 0].map(function (k) {
      var x = X(k), aOn = !!(a & (1 << k)), bOn = !!(b & (1 << k)), g = st.socks[k];
      var sv = per[k].s;
      var sockBase = 'position: absolute; left: ' + (x + 6) + 'px; top: 138px; width: 54px; height: 64px; box-sizing: border-box; border-radius: 10px; font-family: JetBrains Mono, monospace; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0; ';
      var sockStyle = g ? sockBase + 'background: #171B22; border: 2px solid #4ADE80; color: #E8ECF2;'
        : st.sel ? sockBase + 'background: #1D1A12; border: 2px dashed #F5B544; color: #F5B544;'
        : sockBase + 'background: #12161C; border: 2px dashed #5B6575; color: #8A94A3;';
      return {
        bit: k, weight: 1 << k, aOn: aOn, bOn: bOn, aVal: aOn ? '1' : '0', bVal: bOn ? '1' : '0', sym: g ? SYM[g] : '+',
        aLabel: 'A bit ' + k, bLabel: 'B bit ' + k,
        sockLabel: g ? 'Bit ' + k + ' socket: ' + g + '. Tap to remove' : 'Empty bit ' + k + ' socket',
        headStyle: 'position: absolute; left: ' + x + 'px; top: 8px; width: 66px; text-align: center; font-family: JetBrains Mono, monospace; font-size: 11px; color: #9AA4B2',
        aStyle: bitBtn + 'left: ' + x + 'px; top: 28px; ' + onOff(aOn),
        bStyle: bitBtn + 'left: ' + x + 'px; top: 80px; ' + onOff(bOn),
        sockStyle: sockStyle,
        downWire: 'position: absolute; left: ' + (x + 32) + 'px; top: 202px; width: 3px; height: 62px; background: ' + (sv ? HIGH : LOW) + (sv === null ? '; opacity: 0.4' : ''),
        ledStyle: 'position: absolute; left: ' + (x + 22) + 'px; top: 262px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid #5B6575; background: ' + (sv ? HIGH : '#232A36') + (sv ? '; box-shadow: 0 0 0 5px rgba(74,222,128,0.22)' : ''),
        ledLabel: 'position: absolute; left: ' + (x + 46) + 'px; top: 266px; font-family: JetBrains Mono, monospace; font-size: 11px; color: #C5CCD6',
        toggleA: function () { self.setState({ a: a ^ (1 << k) }); },
        toggleB: function () { self.setState({ b: b ^ (1 << k) }); },
        place: function () { self.place(k); }
      };
    });

    var links = [0, 1, 2].map(function (k) {
      var on = !!st.links[k], hot = on && per[k].co;
      var left = X(k) + 6 - 26;
      return {
        on: on,
        label: on ? 'Carry link from bit ' + k + ' to bit ' + (k + 1) + ': connected' : 'Carry link from bit ' + k + ' to bit ' + (k + 1) + ': not connected',
        wireStyle: 'position: absolute; left: ' + left + 'px; top: 168px; width: 26px; height: 0; border-top: 3px ' + (on ? 'solid ' : 'dashed ') + (hot ? HIGH : on ? '#5B6575' : '#3A4352'),
        toggle: function () { self.toggleLink(k); },
        btnStyle: 'position: absolute; left: ' + (X(k) - 29) + 'px; top: 210px; width: 44px; height: 34px; box-sizing: border-box; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; ' +
          (on ? 'background: #12301F; border: 2px solid #4ADE80; color: #4ADE80;' : 'background: #1D1A12; border: 2px dashed #F5B544; color: #F5B544;')
      };
    });

    var co3 = per[3].co;
    var tray = ['FA', 'HA', 'OR'].map(function (g) {
      var selected = st.sel === g;
      return {
        sym: SYM[g], name: g === 'FA' ? 'Full adder' : g === 'HA' ? 'Half adder' : 'OR', selected: selected,
        pick: function () { self.setState({ sel: selected ? null : g }); },
        style: 'height: 54px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: Inter, sans-serif; color: #E8ECF2; ' +
          (selected ? 'background: #1D1A12; border: 2px solid #F5B544;' : 'background: #171B22; border: 2px solid #2A3140;')
      };
    });

    var t = st.test;
    var allPass = !!t && t.pass === 256;
    var testTitle = !t ? 'Test suite' : t.pass + '/256 sums correct';
    var testDetail = !ready ? 'Fill all four sockets first'
      : !t ? 'Every A + B from 0 + 0 to 15 + 15'
      : allPass ? (st.socks[0] === 'HA' ? 'Perfect. Bit 0 has no carry-in, so HA is enough there.' : 'Perfect. Carries ripple right to left.')
      : 'e.g. ' + t.fail.a + ' + ' + t.fail.b + ' gave ' + t.fail.got + ', want ' + (t.fail.a + t.fail.b);
    var wrongNow = ready && sum !== a + b;

    return {
      aDec: a, bDec: b, aBin: bin(a, 4), bBin: bin(b, 4),
      sumDec: sum === null ? '?' : sum, sumBin: sum === null ? '?????' : bin(sum, 5),
      sumStyle: 'font-family: Space Grotesk, sans-serif; font-size: 28px; font-weight: 700; color: ' + (sum === null ? '#9AA4B2' : wrongNow ? '#FF8A7A' : '#4ADE80'),
      cols: cols, links: links,
      coutWire: 'position: absolute; left: 30px; top: 168px; width: 20px; height: 0; border-top: 3px solid ' + (co3 ? HIGH : LOW),
      coutLed: 'position: absolute; left: 10px; top: 160px; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid #5B6575; background: ' + (co3 ? HIGH : '#232A36'),
      tray: tray,
      trayHint: st.sel ? 'NOW TAP A SOCKET ON THE BOARD' : 'YOUR CHIPS — TAP ONE, THEN A SOCKET',
      runAll: function () { self.runAll(); }, cantRun: !ready,
      runStyle: 'height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; ' +
        (ready ? 'background: #F5B544; color: #1A1406; border: none; cursor: pointer;' : 'background: #1F2530; color: #8A94A3; border: 1px solid #2A3140;'),
      testTitle: testTitle, testDetail: testDetail,
      testDetailStyle: 'font-size: 12px; line-height: 1.35; color: ' + (t && !allPass ? '#FFB4A8' : allPass ? '#4ADE80' : '#9AA4B2'),
      allPass: allPass, notPass: !allPass,
      waitText: !ready ? 'Place a chip in every column' : !t ? 'Run the test suite to finish' : 'Fix the circuit and test again',
      waitStyle: 'width: 100%; height: 54px; border-radius: 14px; font-family: Inter, sans-serif; font-weight: 600; font-size: 15px; ' +
        (t && !allPass ? 'background: #2A1715; border: 1px solid #6B2C25; color: #FFB4A8;' : 'background: #1F2530; border: 1px solid #2A3140; color: #B4BCC8;')
    };
  }
}
</script>
</body>
</html>

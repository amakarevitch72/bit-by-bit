<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hard mode board: circuit-board concept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#F5B544}a:hover{color:#FFD08A}
/* Current flowing along a lit trace: moving dashes over the solid copper. */
.flow{stroke-dasharray:3 9;animation:bb-flow .8s linear infinite}
.flow-power{stroke-dasharray:3 9;animation:bb-flow 1.2s linear infinite}
@keyframes bb-flow{to{stroke-dashoffset:-12}}
.led-glow{animation:bb-pulse 1.6s ease-in-out infinite}
@keyframes bb-pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.flow,.flow-power,.led-glow{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 16px 12px 4px; display: flex; align-items: center; gap: 8px">
    <a href="Lesson2.dc.html" aria-label="Back to lesson" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #C5CCD6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #F5B544">LEVEL 2 · HARD MODE</span>
      <span style="font-size: 16px; font-weight: 600">Build an OR gate</span>
    </div>
    <span style="padding: 4px 8px; border-radius: 8px; background: #12301F; color: #4ADE80; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">{{boardStatus}}</span>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">

    <!-- Tools: what a tap on the board does -->
    <div role="radiogroup" aria-label="Board tool" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 12px; background: #12161C; border: 1px solid #232A36">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          <span>{{t.label}}</span>
        </button>
      </sc-for>
    </div>

    <!-- The board: a PCB with pads, silkscreen, copper traces and a live power rail -->
    <div style="position: relative; height: 330px; flex-shrink: 0; border-radius: 18px; overflow: hidden; background-color: #0B1210; border: 1px solid #1E2B24; box-shadow: inset 0 0 0 1px rgba(74,222,128,0.05), inset 0 -40px 80px rgba(0,0,0,0.35); background-image: radial-gradient(circle, #1C2A23 1.3px, transparent 1.6px); background-size: 14px 14px">
      <svg width="358" height="330" viewBox="0 0 358 330" role="img" aria-label="{{boardLabel}}" style="position: absolute; left: 0; top: 0">
        <!-- IN (+5V) terminal block and power rail: always live -->
        <rect x="10" y="8" width="52" height="32" rx="7" fill="#1D1A12" stroke="#F5B544" stroke-width="1.5"></rect>
        <text x="20" y="21" fill="#F5B544" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">IN</text>
        <text x="20" y="34" fill="#C5CCD6" font-family="JetBrains Mono, monospace" font-size="10">+5V</text>
        <circle cx="50" cy="24" r="4" fill="#F5B544"></circle>
        <line x1="54" y1="24" x2="300" y2="24" stroke="#F5B544" stroke-width="5" stroke-linecap="round" opacity="0.35"></line>
        <line x1="54" y1="24" x2="300" y2="24" stroke="#F5B544" stroke-width="3" stroke-linecap="round"></line>
        <line x1="54" y1="24" x2="300" y2="24" stroke="#FFE2A3" stroke-width="2" class="flow-power"></line>
        <text x="306" y="28" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="9">RAIL</text>

        <!-- Collector legs from the rail -->
        <path d="M130 24 V122" fill="none" stroke="#F5B544" stroke-width="3"></path>
        <path d="M130 24 V122" fill="none" stroke="#FFE2A3" stroke-width="2" class="flow-power"></path>
        <path d="M230 24 V122" fill="none" stroke="#F5B544" stroke-width="3"></path>
        <path d="M230 24 V122" fill="none" stroke="#FFE2A3" stroke-width="2" class="flow-power"></path>

        <!-- A → Q1.B -->
        <path d="M60 150 H104" fill="none" stroke="{{cA}}" stroke-width="3" stroke-linecap="round"></path>
        <path d="M60 150 H104" fill="none" stroke="#C8F7D9" stroke-width="2" class="{{fA}}"></path>
        <!-- B → Q2.B (routed along the bottom, then up the right side) -->
        <path d="M60 300 H276 V150 H256" fill="none" stroke="{{cB}}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="M60 300 H276 V150 H256" fill="none" stroke="#C8F7D9" stroke-width="2" class="{{fB}}"></path>
        <!-- Emitters join on one bus, down to the LED -->
        <path d="M130 178 V205 H180" fill="none" stroke="{{cQ1}}" stroke-width="3" stroke-linejoin="round"></path>
        <path d="M130 178 V205 H180" fill="none" stroke="#C8F7D9" stroke-width="2" class="{{fQ1}}"></path>
        <path d="M230 178 V205 H180" fill="none" stroke="{{cQ2}}" stroke-width="3" stroke-linejoin="round"></path>
        <path d="M230 178 V205 H180" fill="none" stroke="#C8F7D9" stroke-width="2" class="{{fQ2}}"></path>
        <path d="M180 205 V236" fill="none" stroke="{{cOut}}" stroke-width="3"></path>
        <path d="M180 205 V236" fill="none" stroke="#C8F7D9" stroke-width="2" class="{{fOut}}"></path>
        <circle cx="180" cy="205" r="4.5" fill="{{cOut}}"></circle>

        <!-- Q1: NPN transistor symbol in a circle. Base bar inside, collector up to the rail, emitter (with arrow) down to the bus. -->
        <circle cx="130" cy="150" r="23" fill="#151B22" stroke="#7D8796" stroke-width="2"></circle>
        <line x1="104" y1="150" x2="120" y2="150" stroke="{{cA}}" stroke-width="2.5"></line>
        <line x1="120" y1="137" x2="120" y2="163" stroke="#E8ECF2" stroke-width="3"></line>
        <path d="M120 144 L130 134 V122" fill="none" stroke="#F5B544" stroke-width="2.5" stroke-linejoin="round"></path>
        <path d="M120 156 L130 166 V178" fill="none" stroke="{{cQ1}}" stroke-width="2.5" stroke-linejoin="round"></path>
        <polygon points="130,166 122,165 126,159" fill="{{cQ1}}"></polygon>
        <text x="158" y="146" fill="#E8ECF2" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">Q1</text>
        <text x="106" y="144" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="8">B</text>
        <text x="136" y="126" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="8">C</text>
        <text x="136" y="182" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="8">E</text>

        <!-- Q2: the same symbol, mirrored so its base faces B on the right -->
        <circle cx="230" cy="150" r="23" fill="#151B22" stroke="#7D8796" stroke-width="2"></circle>
        <line x1="256" y1="150" x2="240" y2="150" stroke="{{cB}}" stroke-width="2.5"></line>
        <line x1="240" y1="137" x2="240" y2="163" stroke="#E8ECF2" stroke-width="3"></line>
        <path d="M240 144 L230 134 V122" fill="none" stroke="#F5B544" stroke-width="2.5" stroke-linejoin="round"></path>
        <path d="M240 156 L230 166 V178" fill="none" stroke="{{cQ2}}" stroke-width="2.5" stroke-linejoin="round"></path>
        <polygon points="230,166 238,165 234,159" fill="{{cQ2}}"></polygon>
        <text x="186" y="146" fill="#E8ECF2" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">Q2</text>
        <text x="248" y="144" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="8">B</text>
        <text x="216" y="126" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="8">C</text>
        <text x="216" y="182" fill="#8A94A3" font-family="JetBrains Mono, monospace" font-size="8">E</text>

        <!-- Gold solder pads at every pin -->
        <g fill="#C9A44C" stroke="#7A5F22" stroke-width="1">
          <circle cx="104" cy="150" r="4"></circle><circle cx="130" cy="122" r="4"></circle><circle cx="130" cy="178" r="4"></circle>
          <circle cx="256" cy="150" r="4"></circle><circle cx="230" cy="122" r="4"></circle><circle cx="230" cy="178" r="4"></circle>
          <circle cx="60" cy="150" r="4"></circle><circle cx="60" cy="300" r="4"></circle><circle cx="180" cy="236" r="4"></circle>
        </g>

        <!-- LED: dome with bloom when lit, cathode to ground -->
        <circle cx="180" cy="256" r="26" fill="{{ledBloom}}" class="{{ledPulse}}"></circle>
        <circle cx="180" cy="256" r="13" fill="{{ledFill}}" stroke="#5B6575" stroke-width="2"></circle>
        <circle cx="176" cy="251" r="4" fill="#FFFFFF" opacity="{{ledShine}}"></circle>
        <text x="200" y="260" fill="#E8ECF2" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">OUT</text>
        <line x1="180" y1="269" x2="180" y2="276" stroke="#5B6575" stroke-width="2"></line>
        <line x1="170" y1="277" x2="190" y2="277" stroke="#5B6575" stroke-width="2"></line>
        <line x1="174" y1="281" x2="186" y2="281" stroke="#5B6575" stroke-width="2"></line>

        <!-- Silkscreen -->
        <text x="196" y="322" fill="#2E4237" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.5">BIT·BY·BIT  REV 2  OR-GATE</text>
      </svg>

      <!-- Switches A and B: physical slide toggles you can flip -->
      <button onClick="{{flipA}}" aria-pressed="{{a}}" aria-label="Switch A" style="{{swA}}"><span style="{{knobA}}"></span></button>
      <span style="position: absolute; left: 14px; top: 124px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">A</span>
      <button onClick="{{flipB}}" aria-pressed="{{b}}" aria-label="Switch B" style="{{swB}}"><span style="{{knobB}}"></span></button>
      <span style="position: absolute; left: 14px; top: 290px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">B</span>
    </div>

    <!-- Parts drawer -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #12161C; border: 1px solid #232A36">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #9AA4B2">PARTS</span>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 1.5px dashed #2A3140">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6 H15 A6 6 0 0 1 15 18 H5 Z" fill="#20262F" stroke="#5B6575" stroke-width="1.5"></path><line x1="8" y1="18" x2="8" y2="23" stroke="#8A94A3" stroke-width="1.5"></line><line x1="11" y1="18" x2="11" y2="23" stroke="#8A94A3" stroke-width="1.5"></line><line x1="14" y1="18" x2="14" y2="23" stroke="#8A94A3" stroke-width="1.5"></line></svg>
        <span style="font-size: 13px; color: #8A94A3">Transistor · 0 left</span>
      </div>
      <span style="margin-left: auto; font-size: 12px; color: #4ADE80">All placed</span>
    </div>

    <!-- Logic analyzer: one lane per signal across the 4 test steps -->
    <div style="padding: 12px; border-radius: 14px; background: #0A0D10; border: 1px solid #232A36; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #9AA4B2">LOGIC ANALYZER</span>
          <span style="font-size: 12px; color: #4ADE80">4/4 steps match</span>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 10px; background: #1D1A12; border: 1px solid #F5B544; color: #F5B544; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">▶ Run test</button>
      </div>
      <sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 54px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #C5CCD6">{{l.name}}</span>
          <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 18px">
            <sc-for list="{{l.cells}}" as="c" hint-placeholder-count="4">
              <div style="{{c.style}}"></div>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 54px"></span>
        <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #4ADE80; text-align: center">
          <span>✓ 00</span><span>✓ 01</span><span>✓ 10</span><span>✓ 11</span>
        </div>
      </div>
    </div>
  </main>

  <footer style="padding: 10px 16px 22px">
    <a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: #4ADE80; color: #0B2414; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      Submit circuit
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: true, b: false, tool: "wire" };
  }
  renderVals() {
    var self = this, st = this.state;
    var HIGH = "#4ADE80", LOW = "#2F3A33";
    var a = st.a, b = st.b, out = a || b; // IN feeds both collectors, so each transistor passes current when its base is on
    function c(v) { return v ? HIGH : LOW; }
    function f(v) { return v ? "flow" : ""; }
    function sw(top, on) {
      return "position: absolute; left: 30px; top: " + top + "px; width: 28px; height: 50px; padding: 0; box-sizing: border-box; border-radius: 8px; cursor: pointer; " +
        "background: #12161C; border: 1.5px solid " + (on ? HIGH : "#3A4352") + "; box-shadow: " + (on ? "0 0 12px rgba(74,222,128,0.35)" : "none");
    }
    function knob(on) {
      return "position: absolute; left: 4px; width: 17px; height: 20px; border-radius: 5px; top: " + (on ? "4px" : "23px") + "; background: " + (on ? HIGH : "#5B6575") + "; transition: top .15s";
    }
    var tools = [
      ["place", "Place", "M12 5v14M5 12h14"],
      ["wire", "Wire", "M4 18c6 0 4-12 10-12h6"],
      ["probe", "Probe", "M14 4l6 6M12 6l6 6-8 8H4v-6z"],
      ["erase", "Erase", "M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"]
    ].map(function (t) {
      var on = st.tool === t[0];
      return {
        label: t[1], icon: t[2], on: on,
        pick: function () { self.setState({ tool: t[0] }); },
        style: "height: 44px; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; border: none; " +
          (on ? "background: #1D1A12; color: #F5B544; box-shadow: inset 0 0 0 1.5px #F5B544;" : "background: transparent; color: #9AA4B2;")
      };
    });
    // Waveforms for the 4 test steps (A B = 00, 01, 10, 11).
    function lane(name, vals, color) {
      return {
        name: name,
        cells: vals.map(function (v, i) {
          var edge = i > 0 && vals[i - 1] !== v ? "border-left: 2px solid " + color + ";" : "";
          return { style: "box-sizing: border-box; " + edge + (v ? "border-top: 2.5px solid " + color + "; background: " + color + "14;" : "border-bottom: 2.5px solid #3A4352;") };
        })
      };
    }
    var want = [false, true, true, true];
    return {
      a: a, b: b,
      cA: c(a), cB: c(b), cQ1: c(a), cQ2: c(b), cOut: c(out),
      fA: f(a), fB: f(b), fQ1: f(a), fQ2: f(b), fOut: f(out),
      ledFill: out ? HIGH : "#1B2420", ledBloom: out ? "rgba(74,222,128,0.28)" : "transparent", ledShine: out ? "0.7" : "0.15",
      ledPulse: out ? "led-glow" : "",
      swA: sw(126, a), swB: sw(275, b), knobA: knob(a), knobB: knob(b),
      flipA: function () { self.setState({ a: !a }); },
      flipB: function () { self.setState({ b: !b }); },
      boardLabel: "Circuit board: IN +5V feeds both transistors; A drives Q1, B drives Q2; both emitters join at the LED, which is " + (out ? "lit" : "dark"),
      boardStatus: out ? "OUT 1" : "OUT 0",
      tools: tools,
      lanes: [
        lane("A", [false, false, true, true], HIGH),
        lane("B", [false, true, false, true], HIGH),
        lane("want", want, "#F5B544"),
        lane("OUT", want, HIGH)
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level map: bright 3D game style</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#7FD4FF}
.plane, .plane *{transform-style:preserve-3d}
.face{position:absolute;box-sizing:border-box}
.flow{stroke-dasharray:4 10;animation:bb-flow .7s linear infinite}
@keyframes bb-flow{to{stroke-dashoffset:-14}}
.bob{animation:bb-bob 1.4s ease-in-out infinite}
@keyframes bb-bob{50%{transform:translateZ(16px)}}
.halo{animation:bb-halo 1.4s ease-in-out infinite}
@keyframes bb-halo{50%{transform:scale(.82);opacity:.6}}
.cloud{animation:bb-drift 18s linear infinite alternate}
@keyframes bb-drift{to{transform:translateX(40px)}}
.twinkle{animation:bb-tw 1.2s ease-in-out infinite}
@keyframes bb-tw{50%{opacity:.2;transform:rotate(45deg) scale(.6)}}
.press{transition:transform .08s}.press:active{transform:translateY(4px)}
@media (prefers-reduced-motion: reduce){.flow,.bob,.halo,.cloud,.twinkle{animation:none}}
.node{cursor:pointer}
.fred{font-family:Fredoka, 'Baloo 2', system-ui, sans-serif}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #1D2A4D; background: linear-gradient(180deg, #5EC6FF 0%, #9EE0FF 45%, #D9F4FF 100%); display: flex; flex-direction: column">

  <!-- sky: soft clouds drifting behind everything -->
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <div class="cloud" style="position: absolute; left: -20px; top: 150px; width: 130px; height: 40px; border-radius: 40px; background: #FFFFFF; opacity: .85; box-shadow: 30px -18px 0 6px #FFFFFF, 70px -6px 0 2px #FFFFFF"></div>
    <div class="cloud" style="position: absolute; left: 250px; top: 230px; width: 110px; height: 34px; border-radius: 34px; background: #FFFFFF; opacity: .7; box-shadow: 26px -14px 0 4px #FFFFFF; animation-duration: 24s"></div>
    <div class="cloud" style="position: absolute; left: 40px; top: 520px; width: 90px; height: 28px; border-radius: 28px; background: #FFFFFF; opacity: .55; box-shadow: 22px -12px 0 3px #FFFFFF; animation-duration: 30s"></div>
  </div>

  <!-- HUD: chunky pills like a mobile game -->
  <header style="position: relative; z-index: 2; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div class="fred" style="flex: 1; font-size: 26px; font-weight: 700; color: #FFFFFF; text-shadow: 0 3px 0 #2E8FD0, 0 0 2px #2E8FD0">Bit by Bit</div>
      <div class="fred" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 6px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 4px 0 #8CC8EA; font-size: 18px; font-weight: 700">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFC93C; box-shadow: inset 0 -3px 0 #E59A00; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; text-shadow: 0 1px 0 #C77F00">★</span>{{starTotal}}
      </div>
      <div class="fred" style="height: 36px; padding: 0 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 4px 0 #8CC8EA; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #3A7BD5">NORMAL</div>
    </div>
    <!-- progress: the computer you are building -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 4px 0 #8CC8EA">
      <span class="fred" style="width: 30px; height: 30px; flex: none; border-radius: 10px; background: #5B8CFF; box-shadow: inset 0 -3px 0 #3A63D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">CPU</span>
      <div style="flex: 1; height: 14px; border-radius: 7px; background: #E3EEF8; box-shadow: inset 0 2px 0 #C9DAEA; overflow: hidden"><div style="{{barStyle}}"></div></div>
      <span class="fred" style="font-size: 14px; font-weight: 700; color: #3A4A6B">{{doneCount}}/24</span>
    </div>
  </header>

  <!-- The 3D island -->
  <div role="img" aria-label="{{sceneLabel}}" style="position: relative; height: 486px; flex: none; perspective: 1000px; perspective-origin: 50% 24%">
    <div class="plane" style="position: absolute; left: 36px; bottom: 40px; width: 318px; height: 900px; transform-origin: 50% 100%; transform: rotateX(58deg)">
      <!-- soft shadow of the floating island on the sky -->
      <div class="face" style="left: 10px; top: 40px; width: 298px; height: 880px; border-radius: 40px; background: rgba(30,90,140,.28); filter: blur(14px); transform: translateZ(-70px)"></div>
      <!-- island slab: grassy-mint board, thick rounded walls -->
      <div class="face" style="left: 0; top: 0; width: 318px; height: 900px; border-radius: 26px; background-color: #5BD18A; background-image: radial-gradient(#86E5AB 2px, transparent 2.5px), linear-gradient(180deg, #4CC57D, #6BDA97); background-size: 22px 22px, 100% 100%; box-shadow: inset 0 0 0 4px #8FEAB4"></div>
      <div class="face" style="left: 14px; top: 900px; width: 290px; height: 38px; transform-origin: top; transform: rotateX(-90deg); background: linear-gradient(180deg, #2FA563, #1F7F4A); border-radius: 0 0 14px 14px"></div>
      <div class="face" style="left: 0; top: 14px; width: 38px; height: 872px; transform-origin: left; transform: rotateY(90deg); background: #2A9659"></div>
      <div class="face" style="left: 318px; top: 14px; width: 38px; height: 872px; transform-origin: left; transform: rotateY(90deg); background: #2A9659"></div>

      <svg width="318" height="900" viewBox="0 0 318 900" style="position: absolute; left: 0; top: 0" aria-hidden="true">
        <line x1="22" y1="420" x2="296" y2="420" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"></line>
        <text x="24" y="882" fill="#FFFFFF" fill-opacity=".85" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" letter-spacing="1">LOGIC GATES</text>
        <text x="24" y="408" fill="#FFFFFF" fill-opacity=".85" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" letter-spacing="1">ARITHMETIC</text>
        <path d="{{dimD}}" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 13"></path>
        <path d="{{litD}}" fill="none" stroke="#E5A800" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="{{litD}}" fill="none" stroke="#FFD93D" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"></path>
        <path d="{{litD}}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" class="flow"></path>
        <path d="{{pinD}}" fill="#FFE36E" stroke="#D9A400" stroke-width="1"></path>
      </svg>

      <div class="face halo" style="{{haloStyle}}"></div>
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="10">
        <div class="{{n.wrapCls}}" style="{{n.wrap}}" onClick="{{n.pick}}" role="button" aria-label="{{n.aria}}">
          <div class="face" style="{{n.shadow}}"></div>
          <div class="face" style="{{n.left}}"></div>
          <div class="face" style="{{n.right}}"></div>
          <div class="face" style="{{n.front}}"></div>
          <div class="face" style="{{n.top}}"><span class="fred" style="{{n.symStyle}}">{{n.sym}}</span></div>
          <div class="face" style="{{n.signWrap}}"><div class="fred" style="{{n.sign}}">{{n.signText}}<span style="{{n.pointer}}"></span></div>
            <span class="twinkle" style="{{n.spark1}}"></span><span class="twinkle" style="{{n.spark2}}"></span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Selected level: a chunky game panel -->
  <section style="position: relative; margin: 0 14px; padding: 14px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 6px 0 #8CC8EA; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div class="fred" style="{{selChip}}">{{selSym}}</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
        <span class="fred" style="{{selEyebrow}}">{{selEyebrowText}}</span>
        <span class="fred" style="font-size: 21px; font-weight: 700; color: #1D2A4D">{{selTitle}}</span>
        <span style="font-size: 13px; color: #5A6888">{{selDesc}}</span>
      </div>
      <span style="display: flex; gap: 1px">
        <sc-for list="{{selStars}}" as="s" hint-placeholder-count="3"><span style="{{s.style}}">★</span></sc-for>
      </span>
    </div>
    <div class="fred press" style="{{selButton}}">{{selButtonText}}</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"number","default":4,"min":1,"max":10},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null };
  }
  renderVals() {
    var self = this;
    var TILT = 58;
    var current = Math.max(1, Math.min(10, Math.round(this.props.current ?? 4)));
    var STARS = [3, 2, 3, 2, 1, 3, 2, 2, 3];
    var L = [
      { n: 1, t: "AND gate", d: "2 transistors in series", sym: "&", x: 86, y: 810, ch: 1 },
      { n: 2, t: "OR gate", d: "2 transistors in parallel", sym: "≥1", x: 232, y: 730, ch: 1 },
      { n: 3, t: "NOT gate", d: "Flip a signal", sym: "1○", x: 96, y: 640, ch: 1 },
      { n: 4, t: "NAND & NOR", d: "The universal gates", sym: "&○", x: 226, y: 550, ch: 1 },
      { n: 5, t: "XOR gate", d: "One or the other, not both", sym: "=1", x: 92, y: 470, ch: 1 },
      { n: 6, t: "Half adder", d: "Sum + carry of two bits", sym: "HA", x: 228, y: 360, ch: 2 },
      { n: 7, t: "Full adder", d: "Add a carry-in", sym: "FA", x: 96, y: 280, ch: 2 },
      { n: 8, t: "4-bit adder", d: "Chain four full adders", sym: "ADD", x: 224, y: 200, ch: 2 },
      { n: 9, t: "Subtractor", d: "Two's complement", sym: "SUB", x: 104, y: 124, ch: 2 },
      { n: 14, t: "Pocket calculator", d: "Milestone · chapter 3", sym: "CALC", x: 170, y: 50, ch: 3, boss: true }
    ];
    function status(i) { return i + 1 < current ? "done" : i + 1 === current ? "current" : "locked"; }
    // Toy-like blocks: light top, mid sides, darker front; text is white with a colored outline.
    var C = {
      done:    { top: "linear-gradient(160deg, #7CF29A, #3FCF6A)", front: "#25A04B", side: "#2FB458", edge: "#B6FFC9", text: "#FFFFFF", ink: "#1E8A3F", h: 26, tile: "#3FCF6A", tileDark: "#25A04B" },
      current: { top: "linear-gradient(160deg, #FFD54D, #FF9F1A)", front: "#E07800", side: "#F08A0C", edge: "#FFF0B3", text: "#FFFFFF", ink: "#C56400", h: 42, tile: "#FFB020", tileDark: "#E07800" },
      locked:  { top: "linear-gradient(160deg, #F4F6FC, #DCE2F0)", front: "#AEB7CF", side: "#C3CBDF", edge: "#FFFFFF", text: "#97A1BC", ink: "#97A1BC", h: 14, tile: "#E3E8F3", tileDark: "#AEB7CF" },
      boss:    { top: "linear-gradient(160deg, #B993FF, #7C4DFF)", front: "#5A2FD0", side: "#6A3EE6", edge: "#E2D4FF", text: "#FFFFFF", ink: "#4B23B8", h: 34, tile: "#8A5CFF", tileDark: "#5A2FD0" }
    };
    var sel = this.state.sel == null ? Math.min(current, 10) - 1 : this.state.sel;

    var litD = "", dimD = "", pinD = "", haloStyle = "display: none";
    for (var i = 0; i < L.length - 1; i++) {
      var a = L[i], b = L[i + 1], lit = i + 2 <= current;
      var ya = a.y - 26, yb = b.y + (b.boss ? 34 : 26), mid = Math.round((ya + yb) / 2);
      var seg = "M" + a.x + " " + ya + " V" + mid + " H" + b.x + " V" + yb + " ";
      if (lit) litD += seg; else dimD += seg;
    }

    var nodes = L.map(function (l, i) {
      var st = l.boss ? (current >= 10 ? "current" : "locked") : status(i);
      var c = l.boss ? C.boss : C[st];
      var w = l.boss ? 140 : 72, d = l.boss ? 68 : 54, h = l.boss ? C.boss.h : c.h;
      var x0 = l.x - w / 2, y0 = l.y - d / 2;
      var count = l.boss ? 6 : 3;
      for (var k = 0; k < count; k++) {
        var px = x0 + 10 + k * ((w - 28) / (count - 1));
        pinD += "M" + Math.round(px) + " " + Math.round(y0 - 9) + " h8 v7 h-8 Z ";
        pinD += "M" + Math.round(px) + " " + Math.round(y0 + d + 2) + " h8 v7 h-8 Z ";
      }
      var on = sel === i;
      var signText = st === "current" ? "PLAY" : st === "done" ? "★★★".slice(0, STARS[i]) : l.boss ? "BOSS" : "";
      if (st === "current") haloStyle = "left: " + (l.x - w * 0.9) + "px; top: " + (l.y - d) + "px; width: " + (w * 1.8) + "px; height: " + (d * 2) + "px; border-radius: 50%; background: radial-gradient(rgba(255,255,255,.85), rgba(255,236,140,.5) 35%, rgba(255,236,140,0) 70%)";
      var outline = "0 2px 0 " + c.ink + ", 1px 0 0 " + c.ink + ", -1px 0 0 " + c.ink + ", 0 -1px 0 " + c.ink;
      function spark(x, y, s) {
        return st === "current"
          ? "position: absolute; left: " + x + "px; bottom: " + y + "px; width: " + s + "px; height: " + s + "px; background: #FFFFFF; transform: rotate(45deg); border-radius: 2px"
          : "display: none";
      }
      return {
        wrapCls: "node" + (st === "current" ? " bob" : ""),
        wrap: "position: absolute; left: " + x0 + "px; top: " + y0 + "px; width: " + w + "px; height: " + d + "px",
        shadow: "left: 6px; top: 14px; width: " + w + "px; height: " + d + "px; border-radius: 16px; background: rgba(20,90,50,.35); filter: blur(6px)",
        left:  "left: 0; top: 6px; width: " + h + "px; height: " + (d - 12) + "px; transform-origin: left; transform: rotateY(-90deg); background: " + c.side,
        right: "left: " + w + "px; top: 6px; width: " + h + "px; height: " + (d - 12) + "px; transform-origin: left; transform: rotateY(-90deg); background: " + c.side,
        front: "left: 6px; top: " + d + "px; width: " + (w - 12) + "px; height: " + h + "px; transform-origin: top; transform: rotateX(90deg); background: linear-gradient(0deg, " + c.front + ", " + c.side + "); border-radius: 0 0 10px 10px",
        top:   "left: 0; top: 0; width: " + w + "px; height: " + d + "px; transform: translateZ(" + h + "px); border-radius: 14px; background: " + c.top + "; " +
               "box-shadow: inset 0 3px 0 " + c.edge + ", inset 0 -4px 0 rgba(0,0,0,.12)" + (on ? ", 0 0 0 4px #FFFFFF, 0 0 0 7px " + c.tileDark : "") + "; display: flex; align-items: center; justify-content: center",
        symStyle: "font-weight: 700; font-size: " + (l.boss ? 24 : 24) + "px; color: " + c.text + "; text-shadow: " + (st === "locked" && !l.boss ? "none" : outline),
        sym: st === "locked" && !l.boss ? String(l.n) : l.sym,
        signWrap: signText
          ? "left: -60px; top: 0px; width: " + (w + 120) + "px; height: 0; transform-origin: 50% 0; transform: translateZ(" + (h + 2) + "px) rotateX(-" + TILT + "deg)"
          : "display: none",
        sign: "position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); white-space: nowrap; font-weight: 700; " +
              (st === "current"
                ? "font-size: 17px; padding: 6px 16px; border-radius: 16px; background: #FFFFFF; color: #FF8A00; box-shadow: 0 4px 0 #E07800"
                : st === "done" ? "font-size: 22px; letter-spacing: -1px; color: #FFD02E; text-shadow: 0 2px 0 #C98A00, 1px 0 0 #C98A00, -1px 0 0 #C98A00"
                : "font-size: 13px; padding: 4px 12px; border-radius: 12px; background: #7C4DFF; color: #FFFFFF; box-shadow: 0 3px 0 #4B23B8"),
        pointer: st === "current"
          ? "position: absolute; left: 50%; bottom: -8px; margin-left: -8px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 9px solid #FFFFFF"
          : "display: none",
        spark1: spark(48, 34, 8), spark2: spark(150, 22, 6),
        signText: signText,
        aria: "Level " + l.n + ", " + l.t + ", " + st + (st === "done" ? ", " + STARS[i] + " stars" : ""),
        pick: function () { self.setState({ sel: i }); }
      };
    });

    var done = Math.min(current - 1, 9);
    var starTotal = STARS.slice(0, done).reduce(function (s, v) { return s + v; }, 0);
    var sl = L[sel], sst = sl.boss ? (current >= 10 ? "current" : "locked") : status(sel);
    var sc = sl.boss ? C.boss : C[sst];
    var prev = sl.boss ? "Level 13" : "Level " + (sl.n - 1);
    var btn = {
      done: ["Replay", "background: linear-gradient(180deg, #6FE08E, #3FCF6A); color: #FFFFFF; box-shadow: 0 5px 0 #25A04B; text-shadow: 0 2px 0 #1E8A3F"],
      current: ["Play", "background: linear-gradient(180deg, #FFC93C, #FF9F1A); color: #FFFFFF; box-shadow: 0 5px 0 #D96A00; text-shadow: 0 2px 0 #C56400"],
      locked: ["Finish " + prev + " first", "background: #E9EDF6; color: #97A1BC; box-shadow: 0 5px 0 #C3CBDF"]
    }[sst];

    return {
      starTotal: starTotal,
      doneCount: done,
      barStyle: "width: " + Math.max(4, Math.round(done / 24 * 100)) + "%; height: 100%; border-radius: 7px; background: linear-gradient(180deg, #8CF0A8, #3FCF6A); box-shadow: inset 0 3px 0 rgba(255,255,255,.5)",
      sceneLabel: "Level map as a bright 3D island. " + done + " levels done, current level " + Math.min(current, 10) + ".",
      litD: litD || "M0 0", dimD: dimD || "M0 0", pinD: pinD, haloStyle: haloStyle, nodes: nodes,
      selChip: "width: 56px; height: 56px; flex: none; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; " +
               "background: " + sc.tile + "; color: " + (sst === "locked" && !sl.boss ? "#97A1BC" : "#FFFFFF") + "; box-shadow: inset 0 3px 0 rgba(255,255,255,.45), 0 5px 0 " + sc.tileDark +
               (sst === "locked" && !sl.boss ? "" : "; text-shadow: 0 2px 0 " + sc.ink),
      selSym: sl.sym,
      selEyebrow: "font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: " + (sst === "locked" ? "#97A1BC" : sst === "done" ? "#25A04B" : "#FF8A00"),
      selEyebrowText: "LEVEL " + sl.n + " · CHAPTER " + sl.ch + (sst === "locked" ? " · LOCKED" : sst === "done" ? " · DONE" : ""),
      selTitle: sl.t, selDesc: sl.d,
      selStars: [0, 1, 2].map(function (k) {
        var lit = sst === "done" && k < STARS[sel];
        return { style: "font-size: 24px; line-height: 1; color: " + (lit ? "#FFD02E" : "#E3E8F3") + "; text-shadow: 0 2px 0 " + (lit ? "#C98A00" : "#C3CBDF") };
      }),
      selButton: "height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; letter-spacing: .02em; cursor: pointer; " + btn[1],
      selButtonText: btn[0]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 28px; gap: 16px">
  <div style="flex: 1"></div>
  <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: #4ADE80">BIT BY BIT</span>
  <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; line-height: 1.1; font-weight: 700">From transistor<br>to computer</h1>
  <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #C5CCD6">Build a computer one chip at a time: gates, adders, a calculator, memory, then a tiny CPU.</p>
  <div style="flex: 1"></div>

  <!-- Saved game (shown only when one exists) -->
  <sc-if value="{{hasSave}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 14px 16px; border-radius: 14px; background: #171B22; border: 1px solid #2A3140; display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA4B2">YOUR GAME</span>
      <span style="font-size: 16px; font-weight: 600">Level 6 · Half adder</span>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 12px; color: #9AA4B2">5 of 24 levels</span>
        <span style="padding: 2px 6px; border-radius: 6px; background: #1D1A12; color: #F5B544; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700">HARD</span>
        <span style="font-size: 12px; color: #F5B544">★ 3 in Hard</span>
      </div>
      <div style="height: 6px; border-radius: 3px; background: #232A36; overflow: hidden"><div style="width: 21%; height: 100%; background: #4ADE80"></div></div>
    </div>
    <a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: #F5B544; color: #1A1406; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
    <a href="NewGame.dc.html" style="height: 54px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2A3140; color: #E8ECF2; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">New game</a>
  </sc-if>

  <!-- First launch: no save yet -->
  <sc-if value="{{noSave}}" hint-placeholder-val="{{ false }}">
    <a href="NewGame.dc.html" style="height: 54px; border-radius: 14px; background: #F5B544; color: #1A1406; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none">New game</a>
    <span style="text-align: center; font-size: 12px; color: #9AA4B2">Your progress is saved on this phone.</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hasSave":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var has = this.props.hasSave ?? true;
    return { hasSave: has, noSave: !has };
  }
}
</script>
</body>
</html>

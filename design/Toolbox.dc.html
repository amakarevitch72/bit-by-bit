<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chip toolbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 28px 20px 14px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Your chips</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #9AA4B2">7 unlocked. Each chip is built from the ones before it.</p>
  </header>

  <main style="flex: 1; padding: 0 16px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="10">
        <button style="{{c.cardStyle}}">
          <div style="display: flex; align-items: center; gap: 0">
            <span style="width: 10px; height: 2px; background: {{c.pin}}"></span>
            <span style="{{c.chipStyle}}">{{c.sym}}</span>
            <sc-if value="{{c.bubble}}" hint-placeholder-val="{{ false }}">
              <span style="width: 8px; height: 8px; border-radius: 50%; border: 2px solid {{c.pin}}; box-sizing: content-box"></span>
            </sc-if>
            <span style="width: 10px; height: 2px; background: {{c.pin}}"></span>
            <sc-if value="{{c.locked}}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="margin-left: auto"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            </sc-if>
          </div>
          <span style="font-size: 15px; font-weight: 600">{{c.name}}</span>
          <span style="font-size: 12px; color: #9AA4B2">{{c.from}}</span>
        </button>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Main" style="height: 84px; flex-shrink: 0; border-top: 1px solid #232A36; background: #12161C; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA4B2; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"></path></svg>
      Journey
    </a>
    <a href="Toolbox.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #F5B544; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>
      Chips
    </a>
    <a href="Workbench.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9AA4B2; text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8" cy="8" r="1"></circle><circle cx="12" cy="8" r="1"></circle><circle cx="16" cy="8" r="1"></circle><circle cx="8" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="16" cy="12" r="1"></circle><path d="M8 16h8"></path></svg>
      Sandbox
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      { name: 'Transistor', sym: 'T', from: 'Starting part', bubble: false, locked: false },
      { name: 'AND', sym: '&', from: '2 transistors', bubble: false, locked: false },
      { name: 'OR', sym: '≥1', from: '2 transistors', bubble: false, locked: false },
      { name: 'NOT', sym: '1', from: '1 transistor', bubble: true, locked: false },
      { name: 'NAND', sym: '&', from: 'AND + NOT', bubble: true, locked: false },
      { name: 'NOR', sym: '≥1', from: 'OR + NOT', bubble: true, locked: false },
      { name: 'XOR', sym: '=1', from: 'NAND, OR, AND', bubble: false, locked: false },
      { name: 'Half adder', sym: 'HA', from: 'Level 6', bubble: false, locked: true },
      { name: 'Full adder', sym: 'FA', from: 'Level 7', bubble: false, locked: true },
      { name: '4-bit adder', sym: 'Σ4', from: 'Level 8', bubble: false, locked: true }
    ];
    return {
      chips: list.map(function (c) {
        var on = !c.locked;
        return {
          name: c.name, sym: c.sym, from: c.from, bubble: c.bubble, locked: c.locked,
          pin: on ? '#4ADE80' : '#3A4352',
          chipStyle: 'min-width: 44px; height: 32px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: JetBrains Mono, monospace; font-size: 15px; font-weight: 700; ' +
            (on ? 'background: #12161C; border: 2px solid #4ADE80; color: #E8ECF2;' : 'background: #12161C; border: 2px dashed #3A4352; color: #8A94A3;'),
          cardStyle: 'height: 104px; padding: 12px; box-sizing: border-box; border-radius: 14px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left; cursor: pointer; font-family: Inter, sans-serif; color: ' + (on ? '#E8ECF2' : '#B4BCC8') + '; ' +
            (on ? 'background: #171B22; border: 1px solid #2A3140;' : 'background: #12161C; border: 1px dashed #2A3140;')
        };
      })
    };
  }
}
</script>
</body>
</html>

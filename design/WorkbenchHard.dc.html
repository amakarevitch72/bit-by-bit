<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hard mode: build it yourself</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#F5B544}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 16px 12px 4px; display: flex; align-items: center; gap: 8px">
    <a href="{{backHref}}" aria-label="Back to lesson" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #C5CCD6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #F5B544">{{eyebrow}}</span>
      <span style="font-size: 16px; font-weight: 600">{{title}}</span>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; font-size: 13px; line-height: 1.4; color: #C5CCD6">{{goal}}</p>

    <!-- Board: 5 × 4 cells. Switches and LEDs are fixed; the chips and wires are the player's build. -->
    <div style="position: relative; width: 358px; height: 300px; flex-shrink: 0; border-radius: 18px; background: #12161C; border: 1px solid #232A36; box-sizing: border-box">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="20">
        <div style="{{c.style}}"><span style="width: 4px; height: 4px; border-radius: 50%; background: #232A36"></span></div>
      </sc-for>
      <sc-for list="{{wires}}" as="w" hint-placeholder-count="4">
        <svg width="358" height="300" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none"><path d="{{w.d}}" fill="none" stroke="{{w.color}}" stroke-width="3"></path></svg>
      </sc-for>
      <sc-for list="{{parts}}" as="p" hint-placeholder-count="5">
        <div style="{{p.box}}">
          <sc-if value="{{p.isSwitch}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{p.flip}}" aria-label="{{p.aria}}" aria-pressed="{{p.on}}" style="{{p.switchStyle}}">{{p.value}}</button>
          </sc-if>
          <sc-if value="{{p.isChip}}" hint-placeholder-val="{{ true }}">
            <span style="width: 44px; height: 24px; box-sizing: border-box; border-radius: 6px; border: 2px solid #4ADE80; background: #12161C; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700">{{p.symbol}}</span>
          </sc-if>
          <sc-if value="{{p.isLed}}" hint-placeholder-val="{{ false }}">
            <span role="img" aria-label="{{p.aria}}" style="{{p.ledStyle}}"></span>
          </sc-if>
          <span style="{{p.labelStyle}}">{{p.label}}</span>
        </div>
      </sc-for>
      <sc-for list="{{pins}}" as="d" hint-placeholder-count="12">
        <span style="{{d.style}}"></span>
      </sc-for>
    </div>

    <p style="margin: 0; font-size: 13px; color: #9AA4B2">Tap a part to wire it. Switches A and B flip when tapped.</p>

    <!-- Palette: only this level's parts, with how many are left -->
    <div style="margin: 0 -16px; padding: 8px 16px; background: #12161C; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA4B2">COMPONENTS</span>
        <span style="font-size: 12px; color: #9AA4B2">Parts for this level</span>
      </div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{palette}}" as="t" hint-placeholder-count="2">
          <div aria-label="{{t.aria}}" style="{{t.style}}">
            <span style="{{t.glyphStyle}}">{{t.symbol}}</span>
            <span style="{{t.nameStyle}}">{{t.name}}</span>
            <span style="{{t.leftStyle}}">{{t.left}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Truth table after Run test -->
    <div style="padding: 10px 12px; border-radius: 14px; background: #171B22; border: 1px solid #2A3140; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 600">{{tableTitle}}</span>
          <span style="font-size: 12px; color: #9AA4B2">4/4 correct</span>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 10px; background: #1D1A12; border: 1px solid #F5B544; color: #F5B544; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Run test</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div style="padding: 6px 0; border-radius: 10px; background: #12161C; display: flex; flex-direction: column; align-items: center; gap: 1px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700">{{r.ab}}</span>
            <span style="font-size: 12px; color: #9AA4B2">want {{r.want}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #4ADE80">✓</span>
          </div>
        </sc-for>
      </div>
    </div>
  </main>

  <footer style="padding: 10px 16px 22px">
    <a href="{{nextHref}}" style="height: 54px; border-radius: 14px; background: #4ADE80; color: #0B2414; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      Submit circuit
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Hard mode, the same screen as the app: fixed switches A, B and the output LEDs; the player places the
// level's parts and wires them. Shown here already solved. WorkbenchHard.dc.html, WorkbenchHard2.dc.html and
// WorkbenchHard6.dc.html are the same file except for level() below.
class Component extends DCLogic {
  level() { return 1; }
  config() {
    var TIP = " A transistor's C pin gets +5V unless you wire something into it.";
    var transistors = {
      A: { c: 0, r: 0, kind: "switch" }, B: { c: 0, r: 3, kind: "switch" },
      Q1: { c: 2, r: 0, kind: "t", symbol: "T" }, Q2: { c: 2, r: 3, kind: "t", symbol: "T" },
      OUT: { c: 4, r: 2, kind: "led" }
    };
    return {
      1: {
        title: "Build an AND gate", goal: "Place both transistors and wire them so the LED lights only when A and B are both on." + TIP,
        back: "Lesson.dc.html", next: "Complete.dc.html",
        parts: transistors, outputs: ["OUT"],
        // Stacked: Q1's emitter feeds Q2's collector.
        wires: [["A", 0, "Q1", 0], ["B", 0, "Q2", 0], ["Q1", 0, "Q2", 1], ["Q2", 0, "OUT", 0]],
        palette: [["T", "Transistor", 0]],
        target: function (a, b) { return [a && b]; }
      },
      2: {
        title: "Build an OR gate", goal: "Place both transistors and wire them so the LED lights when A or B (or both) is on." + TIP,
        back: "Lesson2.dc.html", next: "Main.dc.html",
        parts: transistors, outputs: ["OUT"],
        // Side by side: both emitters join at the LED (wired OR).
        wires: [["A", 0, "Q1", 0], ["B", 0, "Q2", 0], ["Q1", 0, "OUT", 0], ["Q2", 0, "OUT", 0]],
        palette: [["T", "Transistor", 0]],
        target: function (a, b) { return [a || b]; }
      },
      6: {
        title: "Build a half adder",
        goal: "Add A + B. C must show the carry and S the sum bit: 1 + 1 = 10 in binary. Pick your chips, place them and wire both LEDs.",
        back: "Lesson6.dc.html", next: "Main.dc.html",
        parts: {
          A: { c: 0, r: 0, kind: "switch" }, B: { c: 0, r: 3, kind: "switch" },
          AND1: { c: 2, r: 1, kind: "and", symbol: "&" }, XOR1: { c: 2, r: 2, kind: "xor", symbol: "=1" },
          C: { c: 4, r: 1, kind: "led" }, S: { c: 4, r: 2, kind: "led" }
        },
        outputs: ["C", "S"],
        wires: [["A", 0, "AND1", 0], ["B", 0, "AND1", 1], ["A", 0, "XOR1", 0], ["B", 0, "XOR1", 1], ["AND1", 0, "C", 0], ["XOR1", 0, "S", 0]],
        // One of each gate; nothing says which to use. AND and XOR are used up in the solution.
        palette: [["&", "AND", 0], ["≥1", "OR", 1], ["&○", "NAND", 1], ["=1", "XOR", 0]],
        target: function (a, b) { return [a && b, a !== b]; }
      }
    }[this.level()];
  }
  constructor(props) {
    super(props);
    this.state = { a: true, b: true };
  }
  renderVals() {
    var self = this, st = this.state, cfg = this.config(), lv = this.level();
    var HIGH = "#4ADE80", LOW = "#3A4352";
    var COLS = 5, PAD = 8, GAP = 6, W = 358, H = 300;
    var cw = (W - 2 - PAD * 2 - GAP * (COLS - 1)) / COLS, ch = (H - 2 - PAD * 2 - GAP * 3) / 4;
    function cx(c) { return PAD + c * (cw + GAP); }
    function cy(r) { return PAD + r * (ch + GAP); }
    var P = cfg.parts;
    function ins(id) { var k = P[id].kind; return k === "switch" ? 0 : k === "led" ? 1 : 2; }
    function outs(id) { return P[id].kind === "led" ? 0 : 1; }
    function inPin(id, i) { var p = P[id]; return [cx(p.c), cy(p.r) + ch * (i + 1) / (ins(id) + 1)]; }
    function outPin(id, i) { var p = P[id]; return [cx(p.c) + cw, cy(p.r) + ch * (i + 1) / (outs(id) + 1)]; }

    // Tiny simulation, same rules as the app: unwired C = +5V, several wires into one input = OR.
    var out = {};
    function input(id, pin) {
      var drivers = cfg.wires.filter(function (w) { return w[2] === id && w[3] === pin; });
      if (!drivers.length) return P[id].kind === "t" && pin === 1;
      return drivers.some(function (w) { return !!out[w[0]]; });
    }
    function settle() {
      Object.keys(P).forEach(function (id) {
        var k = P[id].kind;
        if (k === "switch") out[id] = id === "A" ? st.a : st.b;
        else if (k === "t") out[id] = input(id, 0) && input(id, 1);
        else if (k === "and") out[id] = input(id, 0) && input(id, 1);
        else if (k === "xor") out[id] = input(id, 0) !== input(id, 1);
      });
    }
    settle(); settle(); settle();

    var cells = [];
    for (var i = 0; i < 20; i++) {
      cells.push({ style: "position: absolute; left: " + cx(i % COLS) + "px; top: " + cy(Math.floor(i / COLS)) + "px; width: " + cw + "px; height: " + ch + "px; box-sizing: border-box; border-radius: 10px; background: #0E1116; border: 1px solid #232A36; display: flex; align-items: center; justify-content: center" });
    }
    var wires = cfg.wires.map(function (w) {
      var a = outPin(w[0], w[1]), b = inPin(w[2], w[3]);
      var bend = Math.max(40, Math.abs(b[0] - a[0]) / 2);
      return {
        d: "M" + a[0] + " " + a[1] + " C" + (a[0] + bend) + " " + a[1] + " " + (b[0] - bend) + " " + b[1] + " " + b[0] + " " + b[1],
        color: out[w[0]] ? HIGH : LOW
      };
    });
    function dot(pt, on) {
      return "position: absolute; left: " + (pt[0] - 4) + "px; top: " + (pt[1] - 4) + "px; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; background: " + (on ? HIGH : LOW);
    }
    var pins = [];
    Object.keys(P).forEach(function (id) {
      for (var k = 0; k < ins(id); k++) pins.push({ style: dot(inPin(id, k), input(id, k)) });
      for (var m = 0; m < outs(id); m++) pins.push({ style: dot(outPin(id, m), !!out[id]) });
    });
    var parts = Object.keys(P).map(function (id) {
      var p = P[id], fixed = p.kind === "switch" || p.kind === "led";
      var on = id === "A" ? st.a : id === "B" ? st.b : false;
      var lit = p.kind === "led" && input(id, 0);
      return {
        label: id, symbol: p.symbol || "", isSwitch: p.kind === "switch", isLed: p.kind === "led", isChip: !fixed, on: on,
        value: on ? "1" : "0",
        aria: p.kind === "switch" ? "Switch " + id + (on ? ", on" : ", off") : "LED " + id + (lit ? ", lit" : ", dark"),
        flip: function () { var patch = {}; patch[id === "A" ? "a" : "b"] = !on; self.setState(patch); },
        box: "position: absolute; left: " + cx(p.c) + "px; top: " + cy(p.r) + "px; width: " + cw + "px; height: " + ch + "px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px",
        switchStyle: "width: 34px; height: 26px; padding: 0; border-radius: 6px; cursor: pointer; font-family: JetBrains Mono, monospace; font-size: 15px; font-weight: 700; color: #E8ECF2; " +
          (on ? "background: #12301F; border: 2px solid #4ADE80;" : "background: #171B22; border: 2px solid #2A3140;"),
        ledStyle: "width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid #5B6575; background: " + (lit ? HIGH + "; box-shadow: 0 0 0 5px rgba(74,222,128,0.22)" : "#232A36"),
        labelStyle: "font-family: JetBrains Mono, monospace; font-size: 10px; " + (fixed ? "font-weight: 700; color: #E8ECF2" : "color: #9AA4B2")
      };
    });
    var palette = cfg.palette.map(function (t) {
      var avail = t[2] > 0;
      return {
        symbol: t[0], name: t[1], left: t[2] + " left", aria: t[1] + ", " + t[2] + " left",
        style: "width: 74px; height: 84px; box-sizing: border-box; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; " +
          (avail ? "background: #171B22; border: 1px solid #2A3140;" : "border: 1.5px dashed #2A3140;"),
        glyphStyle: "min-width: 40px; height: 24px; padding: 0 4px; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: JetBrains Mono, monospace; font-size: 13px; font-weight: 700; " +
          (avail ? "border: 2px solid #4ADE80; color: #E8ECF2;" : "border: 2px solid #3A4352; color: #8A94A3;"),
        nameStyle: "font-size: 12px; color: " + (avail ? "#E8ECF2" : "#8A94A3"),
        leftStyle: "font-size: 11px; color: " + (avail ? "#F5B544" : "#8A94A3")
      };
    });
    var rows = ["00", "01", "10", "11"].map(function (k) {
      var want = cfg.target(k[0] === "1", k[1] === "1").map(function (v) { return v ? "1" : "0"; }).join("");
      return { ab: k[0] + " " + k[1], want: want };
    });
    return {
      eyebrow: "LEVEL " + lv + " · HARD MODE", title: cfg.title, goal: cfg.goal,
      backHref: cfg.back, nextHref: cfg.next,
      tableTitle: "Truth table" + (cfg.outputs.length > 1 ? " · A B → " + cfg.outputs.join(" ") : ""),
      cells: cells, wires: wires, pins: pins, parts: parts, palette: palette, rows: rows
    };
  }
}
</script>
</body>
</html>
